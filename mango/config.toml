[global]

exec_once = waybar
exec_once = swaybg -i /home/henrryk/Zinga/Coisas/Wallpapers/insano.png
exec_once = pipewire
exec_once = swayosd-server 
source = ["./bind.toml", "./env.toml"]

# tag_animation_direction: 1-horizontal,0-vertical
animations = 1
layer_animations = 1
animation_type_open = "fade"
animation_type_close = "fade"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.8
animation_duration_move = 200
animation_duration_open = 200
animation_duration_tag = 200
animation_duration_close = 200
animation_duration_focus = 200
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]
animation_curve_opacity_fade_out = [0.5, 0.5, 0.5, 0.5]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Master-Stack Layout Setting
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1
tag_num = 9
smart_gaps = 0

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# Monocle Layout Setting
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0

# Deck Layout Setting
deck_tab_mode = 1

# Overview Setting
hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5

# Misc
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
enable_floating_snap = 0
snap_distance = 30
float_full_to_top = 0
cursor_size = 18
drag_tile_to_tile = 1
drag_tile_small = 1
auto_reload_config = 1
allow_tearing= 1
cursor_theme = WhiteSur-cursors

# keyboard
repeat_rate = 25
repeat_delay = 600
numlock_on = 0
xkb_rules_layout = "us"

# Trackpad
# need relogin to make it apply
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# Appearance
gap_inner_horizontal = 5
gap_inner_vertical = 5
gap_outer_horizontal = 5
gap_outer_vertical = 5
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 1
root_color = 0x201b14ff
border_color = 0x444444ff
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
focus_color = 0x7a91a9ff
maximized_screen_color = 0x89aa61ff
urgent_color = 0xad401fff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff

# layout support:

[[rule.tag_rule]]
id = 1
layout_name = "tile"

[[rule.tag_rule]]
id = 2
layout_name = "tile"

[[rule.tag_rule]]
id = 3
layout_name = "tile"

[[rule.tag_rule]]
id = 4
layout_name = "tile"

[[rule.tag_rule]]
id = 5
layout_name = "tile"

[[rule.tag_rule]]
id = 6
layout_name = "tile"

[[rule.tag_rule]]
id = 7
layout_name = "tile"

[[rule.tag_rule]]
id = 8
layout_name = "tile"

[[rule.tag_rule]]
id = 9
layout_name = "tile"

# layer rule

[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "fuzzel"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "fuzzel"

[[rule.window_rule]]  
is_floating = 1
no_border = 1
app_id = imv|dolphin|steam|vesktop|mpv

[[rule.window_rule]]
force_tearing = 1
confine_pointer = 1
is_fullscreen = 1
no_border = 1
allow_shortcuts_inhibit = 1
activation_bypass = 1
force_render = 1
idle_inhibit_when_focus = 1
app_id = "steam_app_.*|stud"


[[rule.monitor_rule]]
name = "^DP-1$"
width = 1920
height = 1080
refresh = 180
x = 1920
y = 0
primary = 1

[[rule.monitor_rule]]
name = "^eDP-1$"
width = 1920
height = 1080
refresh = 144
x = 0
y = 0
